[project]
name = "cnplus"
version = "0.4.1"
description = "CNplus —— 使用中文撸代码的编程语言"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AS13379" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
lsp = ["pygls>=1.3"]

[project.scripts]
cnp = "cnplus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cnplus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
