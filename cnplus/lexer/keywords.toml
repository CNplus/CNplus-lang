# CNplus 关键字表 —— 铁律 4「关键字表是数据」
#
# 唯一真相来源：lexer 读它，TextMate 语法从它生成，LSP 补全也读它。
# 加关键字只改这里。每组第一个写法是推荐写法。
#
# 注意：TOML 不允许裸中文作键名，故所有键都加引号。

["关键字"]
"令" = ["令"]
"如果" = ["如果", "若"]
"否则" = ["否则", "不然"]
"循环" = ["循环", "当"]
"函数" = ["函数", "定义"]
"返回" = ["返回", "返"]
"外部" = ["外部"]
"真" = ["真"]
"假" = ["假"]
"空" = ["空"]
"与" = ["与", "并且"]
"或" = ["或", "或者"]
"非" = ["非"]

["运算符"]
"+" = "加"
"-" = "减"
"*" = "乘"
"//" = "整除"
"/" = "除"
"%" = "取余"
"==" = "等于"
"!=" = "不等于"
"<=" = "小于等于"
">=" = "大于等于"
"<" = "小于"
">" = "大于"
"=" = "赋值"

["标点"]
"(" = "左括号"
")" = "右括号"
"," = "逗号"
":" = "冒号"

# 全角 -> 半角。只在 lexer 入口应用一次，一对一映射保证偏移不变。
["归一化"]
"，" = ","
"（" = "("
"）" = ")"
"：" = ":"
"　" = " "
"＋" = "+"
"－" = "-"
"＊" = "*"
"／" = "/"
"＝" = "="
"＜" = "<"
"＞" = ">"
"％" = "%"
"！" = "!"
"“" = "\""
"”" = "\""
"‘" = "'"
"’" = "'"
